{% load static %}<!doctype html>
<html lang="pt-br" data-theme="escudo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block titulo %}Escudo{% endblock %} · Escudo</title>
<link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.0/daisyui.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.4"></script>
<style>
  /* Paleta (fonte única): marinho = confiança/anonimato · ciano = acolhimento/calma · laranja = coragem (detalhe) */
  :root {
    --esc-base-100: #ffffff; --esc-base-200: #e3f8ff; --esc-base-300: #bdeefc; --esc-base-content: #0f1b3d;
    --esc-primary: #0a2fb8;  --esc-primary-content: #ffffff;
    --esc-secondary: #00b8e6; --esc-secondary-content: #03263a;
    --esc-accent: #ff8a00;   --esc-accent-content: #1f1000;
    --esc-neutral: #071f80;  --esc-neutral-content: #ffffff;
    --esc-success: #16a34a;  --esc-warning: #ff8a00; --esc-error: #dc2626;
  }
  /* Tema daisyUI "escudo" */
  [data-theme="escudo"] {
    color-scheme: light;
    --color-base-100: var(--esc-base-100); --color-base-200: var(--esc-base-200); --color-base-300: var(--esc-base-300);
    --color-base-content: var(--esc-base-content);
    --color-primary: var(--esc-primary); --color-primary-content: var(--esc-primary-content);
    --color-secondary: var(--esc-secondary); --color-secondary-content: var(--esc-secondary-content);
    --color-accent: var(--esc-accent); --color-accent-content: var(--esc-accent-content);
    --color-neutral: var(--esc-neutral); --color-neutral-content: var(--esc-neutral-content);
    --color-info: var(--esc-secondary); --color-info-content: var(--esc-secondary-content);
    --color-success: var(--esc-success); --color-success-content: #ffffff;
    --color-warning: var(--esc-warning); --color-warning-content: var(--esc-accent-content);
    --color-error: var(--esc-error); --color-error-content: #ffffff;
    --radius-selector: 1rem; --radius-field: .6rem; --radius-box: 1rem;
    --size-selector: .25rem; --size-field: .25rem; --border: 1px; --depth: 1; --noise: 0;
  }
</style>
<style type="text/tailwindcss">
  /* As mesmas cores para o Tailwind, para funcionar bg-primary/10, from-neutral, ring-error etc. */
  @theme inline {
    --color-base-100: var(--esc-base-100); --color-base-200: var(--esc-base-200); --color-base-300: var(--esc-base-300);
    --color-base-content: var(--esc-base-content);
    --color-primary: var(--esc-primary); --color-primary-content: var(--esc-primary-content);
    --color-secondary: var(--esc-secondary); --color-accent: var(--esc-accent);
    --color-neutral: var(--esc-neutral); --color-neutral-content: var(--esc-neutral-content);
    --color-success: var(--esc-success); --color-warning: var(--esc-warning); --color-error: var(--esc-error);
  }
</style>
{% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-base-200 text-base-content">
{% block pagina %}{% endblock %}
<script src="{% static 'escudo.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
