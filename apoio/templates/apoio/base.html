{% load static %}<!doctype html>
<html lang="pt-br" data-theme="escudo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block titulo %}Início{% endblock %} · Colégio Esperança</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.0/daisyui.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.4"></script>
<style>
  /* Paleta (fonte única) — estilo editorial/brutalista:
     papel + tinta = sério e humano · azul = confiança · amarelo = ação/esperança (detalhe) */
  :root {
    --esc-ink: #171914;
    --esc-base-100: #f6f3e9; --esc-base-200: #edf2ff; --esc-base-300: #d6d2c4; --esc-base-content: #171914;
    --esc-primary: #18478e;  --esc-primary-content: #ffffff;
    --esc-secondary: #2f6fd6; --esc-secondary-content: #ffffff;
    --esc-accent: #f9db3c;   --esc-accent-content: #171914;
    --esc-neutral: #171914;  --esc-neutral-content: #f6f3e9;
    --esc-success: #1f7a3a;  --esc-warning: #f9db3c; --esc-error: #d1281f;
  }
  /* Tema daisyUI "escudo" */
  [data-theme="escudo"] {
    color-scheme: light;
    --color-base-100: var(--esc-base-100); --color-base-200: var(--esc-base-200); --color-base-300: var(--esc-base-300);
    --color-base-content: var(--esc-base-content);
    --color-primary: var(--esc-primary); --color-primary-content: var(--esc-primary-content);
    --color-secondary: var(--esc-secondary); --color-secondary-content: var(--esc-secondary-content);
    --color-accent: var(--esc-accent); --color-accent-content: var(--esc-accent-content);
    --color-neutral: var(--esc-neutral); --color-neutral-content: var(--esc-neutral-content);
    --color-info: var(--esc-secondary); --color-info-content: var(--esc-secondary-content);
    --color-success: var(--esc-success); --color-success-content: #ffffff;
    --color-warning: var(--esc-warning); --color-warning-content: var(--esc-ink);
    --color-error: var(--esc-error); --color-error-content: #ffffff;
    --radius-selector: 0; --radius-field: 0; --radius-box: 0;
    --size-selector: .25rem; --size-field: .25rem; --border: 2px; --depth: 0; --noise: 0;
  }

  /* Tipografia: títulos pesados (Archivo Black), texto em DM Sans */
  body { font-family: "DM Sans", system-ui, sans-serif; }
  h1, h2, .titulo { font-family: "Archivo Black", Impact, sans-serif; font-weight: 400; letter-spacing: -0.03em; }
  .rotulo { font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--esc-primary); }

  /* Blocos: borda de tinta, cantos retos, sombra dura deslocada (sem desfoque) */
  .card, .stats, .borda { border: 2px solid var(--esc-ink) !important; border-radius: 0 !important; box-shadow: 5px 5px 0 var(--esc-primary) !important; }
  .card.sem-sombra { box-shadow: none !important; }
  .btn { border: 2px solid var(--esc-ink); border-radius: 0; box-shadow: 4px 4px 0 var(--esc-ink); font-weight: 700;
         transition: translate .1s, box-shadow .1s; }
  .btn:hover { translate: -1px -1px; box-shadow: 5px 5px 0 var(--esc-ink); }
  .btn:active { translate: 3px 3px; box-shadow: 1px 1px 0 var(--esc-ink); }
  .btn-ghost, .btn-link { border-color: transparent; box-shadow: none; }
  .btn-ghost:hover, .btn-ghost:active { translate: none; box-shadow: none; }
  .input, .select, .textarea, .file-input { border: 2px solid var(--esc-ink); border-radius: 0; box-shadow: none; background-color: #fff; }
  .badge { border: 2px solid var(--esc-ink); border-radius: 0; font-weight: 700; }
  .alert { border: 2px solid var(--esc-ink); border-radius: 0; }
  /* Avisos sempre legíveis: texto em tinta (o "soft" do daisyUI pintava o texto de amarelo) */
  .alert-warning { background: var(--esc-accent) !important; color: var(--esc-ink) !important; }
  .alert-soft.alert-error { background: #fde8e6 !important; color: var(--esc-ink) !important; border-color: var(--esc-error); }
  .alert-soft.alert-error > i, .alert-soft.alert-error strong { color: var(--esc-error); }
  .rounded-box, .rounded-xl, .rounded-full, .rounded, .kbd, .progress, .menu :where(li > *) { border-radius: 0 !important; }
</style>
<style type="text/tailwindcss">
  /* As mesmas cores para o Tailwind, para funcionar bg-primary/10, border-ink, ring-error etc. */
  @theme inline {
    --color-ink: var(--esc-ink);
    --color-base-100: var(--esc-base-100); --color-base-200: var(--esc-base-200); --color-base-300: var(--esc-base-300);
    --color-base-content: var(--esc-base-content);
    --color-primary: var(--esc-primary); --color-primary-content: var(--esc-primary-content);
    --color-secondary: var(--esc-secondary); --color-accent: var(--esc-accent);
    --color-neutral: var(--esc-neutral); --color-neutral-content: var(--esc-neutral-content);
    --color-success: var(--esc-success); --color-warning: var(--esc-warning); --color-error: var(--esc-error);
  }
</style>
{% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-base-200 text-base-content">
{% block pagina %}{% endblock %}
<script src="{% static 'escudo.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
